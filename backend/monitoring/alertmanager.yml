global:
  resolve_timeout: 5m

# Templates
templates: []

# Root route with all parameters, which are inherited by the child routes
route:
  receiver: 'webhook-default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 3h
      continue: true

    # Warning alerts - batched
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      group_interval: 1h
      repeat_interval: 24h

    # Info/debug alerts - less frequent
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 1m
      group_interval: 6h
      repeat_interval: 48h

    # Database alerts - to dedicated channel
    - match:
        service: database
      receiver: 'database-alerts'
      group_wait: 10s
      group_interval: 30m
      repeat_interval: 6h
      continue: true

    # System resource alerts
    - match:
        service: system
      receiver: 'system-alerts'
      group_wait: 30s
      group_interval: 1h
      repeat_interval: 24h

    # Monitoring system alerts - highest priority
    - match:
        service: monitoring
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 1h

# Receivers - where alerts are sent
receivers:
  - name: 'webhook-default'
    webhook_configs:
      - url: 'http://alertmanager_webhook:5001/alert'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://alertmanager_webhook:5001/alert/critical'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://alertmanager_webhook:5001/alert/warning'
        send_resolved: true

  - name: 'info-alerts'
    webhook_configs:
      - url: 'http://alertmanager_webhook:5001/alert/info'
        send_resolved: true

  - name: 'database-alerts'
    webhook_configs:
      - url: 'http://alertmanager_webhook:5001/alert/database'
        send_resolved: true

  - name: 'system-alerts'
    webhook_configs:
      - url: 'http://alertmanager_webhook:5001/alert/system'
        send_resolved: true

# Inhibition rules - suppress alerts based on conditions
inhibit_rules:
  # Don't alert on high memory if system is already down
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['instance', 'service']

  # Don't alert on connection issues if database is down
  - source_match:
      alertname: 'PostgresDown'
    target_match:
      service: 'database'
    equal: ['instance']

  # Don't alert on backend errors if backend is down
  - source_match:
      alertname: 'BackendDown'
    target_match:
      service: 'backend'
    equal: ['instance']

  # Suppress resolved alerts after 1 hour
  - source_match:
      severity: 'info'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']
