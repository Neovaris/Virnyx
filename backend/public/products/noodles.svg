<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Bowl -->
  <ellipse cx="100" cy="100" rx="60" ry="45" fill="#CD853F"/>
  <path d="M 40 100 Q 50 80 100 75 Q 150 80 160 100" stroke="#8B4513" stroke-width="2" fill="none"/>
  
  <!-- Noodles -->
  <path d="M 60 110 Q 70 100 80 110 Q 90 100 100 110 Q 110 100 120 110 Q 130 100 140 110" stroke="#F5DEB3" stroke-width="3" fill="none"/>
  <path d="M 65 125 Q 75 115 85 125 Q 95 115 105 125 Q 115 115 125 125 Q 135 115 140 125" stroke="#FFD700" stroke-width="3" fill="none"/>
  
  <!-- Broth -->
  <ellipse cx="100" cy="120" rx="55" ry="25" fill="url(#broth-gradient)" opacity="0.7"/>
  
  <!-- Egg -->
  <circle cx="80" cy="105" r="8" fill="#FFFACD"/>
  <circle cx="80" cy="105" r="5" fill="#FF8C00"/>
  
  <!-- Vegetable (green onion) -->
  <g stroke="#228B22" stroke-width="2" fill="none">
    <path d="M 130 110 Q 135 100 130 90"/>
    <path d="M 135 110 Q 142 105 140 90"/>
  </g>
  
  <!-- Steam -->
  <path d="M 70 70 Q 72 60 70 50" stroke="#D3D3D3" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 100 65 Q 102 55 100 45" stroke="#D3D3D3" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 130 70 Q 132 60 130 50" stroke="#D3D3D3" stroke-width="2" fill="none" opacity="0.7"/>
  
  <defs>
    <linearGradient id="broth-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.6" />
    </linearGradient>
  </defs>
</svg>
