<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Glass -->
  <path d="M 60 80 L 65 140 Q 65 150 75 150 L 125 150 Q 135 150 135 140 L 140 80 Z" fill="#E0FFFF" stroke="#4682B4" stroke-width="2"/>
  
  <!-- Liquid (Coke/Cola) -->
  <path d="M 62 100 L 67 135 Q 67 145 75 145 L 125 145 Q 133 145 133 135 L 138 100" fill="#8B4513"/>
  
  <!-- Ice cubes -->
  <rect x="75" y="105" width="15" height="15" fill="#E0FFFF" stroke="#87CEEB" stroke-width="1" opacity="0.7"/>
  <rect x="100" y="110" width="12" height="12" fill="#E0FFFF" stroke="#87CEEB" stroke-width="1" opacity="0.7"/>
  
  <!-- Straw -->
  <rect x="95" y="50" width="8" height="100" fill="#FF1493" rx="4"/>
  <circle cx="99" cy="50" r="4" fill="#FF1493"/>
  
  <!-- Straw stripes -->
  <line x1="95" y1="60" x2="103" y2="60" stroke="#FF69B4" stroke-width="1"/>
  <line x1="95" y1="70" x2="103" y2="70" stroke="#FF69B4" stroke-width="1"/>
  <line x1="95" y1="80" x2="103" y2="80" stroke="#FF69B4" stroke-width="1"/>
  <line x1="95" y1="90" x2="103" y2="90" stroke="#FF69B4" stroke-width="1"/>
  <line x1="95" y1="100" x2="103" y2="100" stroke="#FF69B4" stroke-width="1"/>
  
  <!-- Bubbles -->
  <circle cx="90" cy="85" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="110" cy="95" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="85" cy="115" r="2" fill="#FFD700" opacity="0.6"/>
  
  <!-- Condensation -->
  <circle cx="55" cy="110" r="2" fill="#ADD8E6" opacity="0.5"/>
  <circle cx="145" cy="120" r="2" fill="#ADD8E6" opacity="0.5"/>
</svg>
