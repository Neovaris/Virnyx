  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Top bun -->
  <ellipse cx="100" cy="60" rx="50" ry="25" fill="#D2691E"/>
  <rect x="50" y="60" width="100" height="25" fill="#CD853F"/>
  
  <!-- Sesame seeds -->
  <circle cx="70" cy="50" r="3" fill="#F5DEB3"/>
  <circle cx="90" cy="45" r="3" fill="#F5DEB3"/>
  <circle cx="110" cy="48" r="3" fill="#F5DEB3"/>
  <circle cx="130" cy="52" r="3" fill="#F5DEB3"/>
  
  <!-- Lettuce -->
  <path d="M 50 85 Q 100 80 150 85 L 145 95 Q 100 92 55 95 Z" fill="#228B22"/>
  
  <!-- Cheese -->
  <rect x="55" y="100" width="90" height="10" fill="#FFD700"/>
  
  <!-- Patty -->
