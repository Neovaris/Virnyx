  <!-- Tomato -->
  <circle cx="75" cy="145" r="8" fill="#FF6347"/>
  <circle cx="125" cy="145" r="8" fill="#FF6347"/>
  
  <!-- Bottom bun -->
  <rect x="50" y="155" width="100" height="20" fill="#D2691E" rx="10"/>
  
  <!-- Bottom bun texture -->
